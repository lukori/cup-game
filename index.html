<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>אין "לזרוק"</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{--coffee:#3b1f14;--cream:#fff4e2;--coral:#c4702c}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#201713;font-family:Rubik,system-ui,sans-serif;color:var(--cream)}
#room,#cam,#gl,#tint{position:fixed;inset:0;width:100%;height:100%}
#room{top:-150%;height:400%;background:linear-gradient(#9fd3d0 0%,#f6d9b0 49%,#c98f6b 51%,#6d4436 100%)}
#cam{object-fit:cover;display:none}
#gl{touch-action:none}
#tint{pointer-events:none;background:radial-gradient(circle,transparent 35%,rgba(25,12,6,.85));opacity:0;transition:opacity 1s}
.pill{position:fixed;top:calc(12px + env(safe-area-inset-top));background:rgba(40,20,12,.72);border-radius:18px;padding:7px 14px;text-align:center;min-width:104px;display:none}
.pill small{display:block;font-size:12px;opacity:.75}
.pill b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
#pTime{right:12px}#pYears{left:12px}
#bottom{position:fixed;left:16px;right:16px;top:calc(92px + env(safe-area-inset-top));display:none;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#msg{background:rgba(40,20,12,.78);border-radius:20px;padding:12px 20px;font-size:19px;font-weight:600;text-align:center;line-height:1.35}
#dots{display:flex;gap:8px;direction:ltr}
.dot{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--cream);background:rgba(40,20,12,.4)}
.dot.on{background:#8a4a23;transform:scale(1.15)}
#arrow{position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;display:none;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center;background:rgba(32,18,12,.80)}
.screen h1{font-size:56px;font-weight:900;line-height:1}
.screen p{font-size:18px;line-height:1.5;max-width:340px}
.screen .fine{font-size:12.5px;opacity:.7}
button{font:900 22px Rubik,system-ui,sans-serif;background:var(--coral);color:#fff;border:0;border-radius:40px;padding:16px 44px;box-shadow:0 6px 0 #7a3f14;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #7a3f14}
#end{display:none;background:rgba(32,18,12,.62)}
#big{position:fixed;top:34%;left:0;right:0;text-align:center;font-size:84px;font-weight:900;display:none;pointer-events:none;text-shadow:0 6px 24px rgba(0,0,0,.7);direction:ltr}
#err{font-size:14px;color:#ffb7a8}
</style>
</head>
<body>
<div id="room"></div>
<video id="cam" playsinline muted autoplay></video>
<div id="tint"></div>
<canvas id="gl"></canvas>

<div class="pill" id="pTime"><small>זמן שימוש</small><b id="vTime">0:00</b></div>
<div class="pill" id="pYears"><small>שנות כוס אחריכם</small><b id="vYears">0</b></div>
<svg id="arrow" viewBox="0 0 44 44"><path d="M40 22 12 6l6 16-6 16z" fill="#c4702c" stroke="#fff4e2" stroke-width="3" stroke-linejoin="round"/></svg>
<div id="bottom"><div id="msg"></div><div id="dots"></div></div>
<div id="big"></div>

<div class="screen" id="intro">
  <h1>אין<br>"לזרוק"</h1>
  <p>הקפה באוויר. הזיזו את הטלפון סביבכם ותפסו אותו בכוס.</p>
  <p class="fine">עמדו במקום פנוי. נבקש גישה לתנועה ולמצלמה. שום דבר לא מוקלט ולא נשלח.</p>
  <button id="go">כוס אחת</button>
  <div id="err"></div>
</div>

<div class="screen" id="end">
  <h1 style="font-size:40px">השימוש נגמר.<br>הכוסות לא.</h1>
  <p id="summary"></p>
  <p class="fine">30 שנה היא הערכה של מומחה לגבי ציפוי הפלסטיק בכוס נייר (אימפריאל קולג׳, 2016). גם הוא ציין שאין ודאות.</p>
  <button id="again">עוד כוס?</button>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const D=Math.PI/180, clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a), lerp=(a,b,t)=>a+(b-a)*t;
/* ---------- tuning: everything about the feel of weight lives here ---------- */
const TUNE={
  dropsPerCup:[4,4,5,5,5,4,4],      // last cup never gets full
  collapseAfter:2,                   // drops into the last cup before it gives up
  stiffness:[15,10,7.4,5.8,4.7,3.9,3.2],   // lower = slower to follow the hand
  damping:  [1.0,.85,.72,.62,.55,.5,.5],   // lower = more swing past the target
  sag:      [0,5,10,15,20,26,31],          // degrees the cup hangs below your aim
  dropPitch:[[-8,10],[-12,16],[-5,24],[5,32],[12,38],[20,46],[28,50]],
  catchAngle:8.5,
  yearsPerCup:30,
  tiltToDrink:28,                    // degrees of sideways tilt that starts drinking (then it keeps pouring)
  heavy:1,                           // x sag: 1.5 = cups hang 50% lower
  slow:1                             // x slowness: 1.5 = cups follow the hand 50% slower
};
/* every TUNE number can be overridden from the address: ?heavy=1.3&catchAngle=10&debug */
const URLP=new URLSearchParams(location.search);
for(const k in TUNE)if(typeof TUNE[k]==='number'&&URLP.has(k)&&isFinite(+URLP.get(k)))TUNE[k]=+URLP.get(k);
const sagOf=L=>TUNE.sag[L]*TUNE.heavy, stiffOf=L=>TUNE.stiffness[L]/TUNE.slow;
/* ---------- vectors ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(...a)||1;return mul(a,1/l)};
const dirOf=(yaw,pitch)=>[Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)];
const yawOf=d=>Math.atan2(d[0],-d[2]), pitchOf=d=>Math.asin(clamp(d[1],-1,1));
const angle=(a,b)=>Math.acos(clamp(dot(a,b),-1,1));
const frame=f=>{let r=cross(f,[0,1,0]);r=Math.hypot(...r)<1e-4?[1,0,0]:norm(r);return[r,cross(r,f)]};
const rotAxis=(v,k,a)=>add(add(mul(v,Math.cos(a)),mul(cross(k,v),Math.sin(a))),mul(k,dot(k,v)*(1-Math.cos(a))));

/* ---------- view: gyro on phones, drag elsewhere ---------- */
const view={yaw:0,pitch:0,gyro:false,R:[1,0,0],U:[0,1,0],F:[0,0,-1],roll:0};
let q=null;
const qmul=(a,b)=>[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];
function onOrient(e){
  if(e.beta==null||e.alpha==null)return;
  const x=e.beta*D/2,y=e.alpha*D/2,z=-e.gamma*D/2;
  const c1=Math.cos(x),c2=Math.cos(y),c3=Math.cos(z),s1=Math.sin(x),s2=Math.sin(y),s3=Math.sin(z);
  let o=[s1*c2*c3+c1*s2*s3,c1*s2*c3-s1*c2*s3,c1*c2*s3-s1*s2*c3,c1*c2*c3+s1*s2*s3];
  o=qmul(o,[-Math.SQRT1_2,0,0,Math.SQRT1_2]);
  const sa=-((screen.orientation&&screen.orientation.angle)||window.orientation||0)*D/2;
  q=qmul(o,[0,0,Math.sin(sa),Math.cos(sa)]);
  view.gyro=true;
}
const qrot=(q,v)=>{const u=[q[0],q[1],q[2]],t=mul(cross(u,v),2);return add(add(v,mul(t,q[3])),cross(u,t))};
function updateView(){
  if(view.gyro){view.R=qrot(q,[1,0,0]);view.U=qrot(q,[0,1,0]);view.F=qrot(q,[0,0,-1]);
    view.yaw=yawOf(view.F);view.pitch=pitchOf(view.F);view.roll=Math.asin(clamp(view.R[1],-1,1));}
  else{view.F=dirOf(view.yaw,view.pitch);[view.R,view.U]=frame(view.F);view.roll=0;}
}

/* ---------- WebGL ---------- */
const cv=$('gl'), gl=cv.getContext('webgl',{alpha:true,antialias:true,premultipliedAlpha:true});
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,`attribute vec3 p,n;attribute vec2 t;uniform mat4 P,V,M;varying vec3 vN,vW;varying vec2 vT;
void main(){vec4 w=M*vec4(p,1.);vW=w.xyz;vN=mat3(M)*n;vT=t;gl_Position=P*V*w;}`));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`precision mediump float;varying vec3 vN,vW;varying vec2 vT;uniform vec3 C,L;uniform sampler2D S;uniform float gloss,alpha,glow,dirt,useS;
void main(){vec3 n=normalize(vN),v=normalize(-vW),l=L;
vec3 base=useS>.5?texture2D(S,vT).rgb:C;
if(glow>.5){float a=pow(abs(dot(n,v)),3.)*alpha;gl_FragColor=vec4(C*a,a);return;}
float d=dot(n,l)*.5+.5;vec3 c=base*mix(vec3(.55,.46,.44),vec3(1.1,1.07,1.02),smoothstep(.1,.9,d));
float s=pow(max(dot(reflect(-l,n),v),0.),38.)*gloss;float r=pow(1.-abs(dot(n,v)),3.);
c+=s*.6+r*.16*vec3(1.,.85,.7)*gloss;float g=dot(c,vec3(.3,.59,.11));c=mix(c,vec3(g)*vec3(.82,.74,.6),dirt);
gl_FragColor=vec4(c*alpha,alpha);}`));
gl.linkProgram(pr);gl.useProgram(pr);
const loc={p:gl.getAttribLocation(pr,'p'),n:gl.getAttribLocation(pr,'n'),t:gl.getAttribLocation(pr,'t')};
['P','V','M','C','L','S','gloss','alpha','glow','dirt','useS'].forEach(u=>loc[u]=gl.getUniformLocation(pr,u));
function lathe(prof,seg=36,dent){
  const ys=prof.map(a=>a[1]),y0=Math.min(...ys),yr=(Math.max(...ys)-y0)||1;
  const v=[],ix=[],N=prof.length;
  for(let j=0;j<N;j++){const a=prof[Math.max(j-1,0)],b=prof[Math.min(j+1,N-1)];let nr=b[1]-a[1],ny=-(b[0]-a[0]);const l=Math.hypot(nr,ny)||1;nr/=l;ny/=l;
    for(let i=0;i<=seg;i++){const t=i/seg*Math.PI*2,c=Math.cos(t),s=Math.sin(t);const y=prof[j][1];let R=prof[j][0],nx=nr*c,nz=nr*s;
      if(dent){const k=dent(t,y);R*=k;const g=(dent(t+.05,y)-k)/.05;nx+=s*g*1.3;nz-=c*g*1.3}
      v.push(R*c,y,R*s,nx,ny,nz,1-i/seg,1-(y-y0)/yr)}}
  for(let j=0;j<N-1;j++)for(let i=0;i<seg;i++){const a=j*(seg+1)+i,b=a+seg+1;ix.push(a,b,a+1,b,b+1,a+1)}
  const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(v),gl.STATIC_DRAW);
  const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(ix),gl.STATIC_DRAW);
  return{vb,ib,n:ix.length};
}
/* ---------- the cup: kraft paper, rolled rim, stained inside ---------- */
const ring=(R,y,t,k=10)=>Array.from({length:k+1},(_,i)=>{const a=i/k*Math.PI*2;return[R+Math.cos(a)*t,y+Math.sin(a)*t]});
const cupR=y=>lerp(.218,.318,(y+.4)/.8);
const steps=(n,a,b,f)=>Array.from({length:n+1},(_,i)=>{const y=lerp(a,b,i/n);return[f(y),y]});
// a dent is a few soft hollows pressed into the paper; the same one bends wall, inside and rim
const makeDent=(list)=>(t,y)=>{let k=1;for(const[a,h,depth,wa,wh]of list){let da=Math.atan2(Math.sin(t-a),Math.cos(t-a));const dh=y-h;
  k-=depth*Math.exp(-da*da/(wa*wa)-dh*dh/(wh*wh))}return k};
const cupMesh=d=>({wall:lathe(steps(22,-.4,.4,cupR),48,d),inner:lathe(steps(14,.395,-.37,y=>cupR(y)-.012),48,d),rim:lathe(ring(.325,.402,.021),48,d)});
const FRESH=cupMesh(makeDent([[2.2,-.08,.045,.35,.07]]));
const USED=[
  cupMesh(makeDent([[1.3,-.05,.22,.7,.2],[4.2,.2,.16,.5,.14]])),
  cupMesh(makeDent([[.4,.1,.3,.9,.16],[3.3,-.2,.2,.6,.12],[5.1,.32,.18,.4,.12]])),
  cupMesh(makeDent([[2,0,.38,1.1,.15],[5,-.1,.28,.8,.2],[.2,.38,.2,.5,.1]]))];
const MESH={
  base:lathe([[0,-.385],[.205,-.385],[.218,-.4]]),
  coffee:lathe([[1,0],[.5,.0],[0,0]]),
  drop:lathe(Array.from({length:19},(_,i)=>{const t=i/18*Math.PI;return[Math.sin(t)*Math.pow(Math.sin(t/2),.2)*(t>1.9?1-(t-1.9)*.38:1)*.13,-Math.cos(t)*.13+(t>2?Math.pow(t-2,2)*.075:0)]}),24),
  ball:lathe(Array.from({length:13},(_,i)=>{const t=i/12*Math.PI;return[Math.sin(t),-Math.cos(t)]}),20),
  rope:lathe([[1,0],[1,1]],6)
};

  const y=lerp(-.36,.33,fill),R=(cupR(y)-.016)*s,at=mul(up,(fill>.01?y:-.37)*s);
  if(fill>.01)draw(MESH.coffee,add(pos,at),r,up,b,R,s,R,COFFEE,{gloss:.9,dirt:o.dirt});
  else draw(MESH.coffee,add(pos,at),r,up,b,.205*s,s,.205*s,col(0xb98a5c),{gloss:.1,dirt:o.dirt});
}

/* ---------- sound ---------- */
let ac=null,drone=null;
function audioInit(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();
  if(!drone){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=55;g.gain.value=0;o.connect(g).connect(ac.destination);o.start();drone={o,g}}}catch(e){}}
function tone(f,f2,t=.18,type='sine',vol=.25){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f2,n+t);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+t);o.connect(g).connect(ac.destination);o.start(n);o.stop(n+t)}
const buzz=ms=>navigator.vibrate&&navigator.vibrate(ms);

/* ---------- game ---------- */
const YEAR0=new Date().getFullYear();
const G={state:'intro',cup:0,fill:0,got:0,old:[],ghosts:[],drops:[],splash:[],rain:[],time:0,t:0,aim:[0,0,-1],vel:[0,0,0],hold:false,fly:null,thrown:0};
try{G.ghosts=(JSON.parse(localStorage.getItem('away-cups'))||[]).slice(-60)}catch(e){}
const level=()=>Math.min(G.cup,TUNE.stiffness.length-1);
const need=()=>TUNE.dropsPerCup[level()];
function say(t){$('msg').innerHTML=t}
function dots(){$('dots').innerHTML=Array.from({length:need()},(_,i)=>`<i class="dot${i<G.got?' on':''}"></i>`).join('')}
function spawn(first){
  const [a,b]=TUNE.dropPitch[level()];
  const off=first?(Math.random()<.5?-1:1)*rnd(.23,.28):(Math.random()<.5?-1:1)*rnd(35,G.cup<2?100:150)*D;
  G.drops=[{yaw:view.yaw+off,pitch:rnd(a,b)*D,born:G.t,phase:rnd(0,6)}];
}
const dropDir=d=>dirOf(d.yaw+Math.sin(G.t*.7+d.phase)*.035,d.pitch+Math.sin(G.t*1.3+d.phase)*.03);
function startCup(){
  G.state='catch';G.fill=0;G.got=0;G.pouring=false;dots();spawn(G.cup===0);
  say(['הזיזו את הטלפון ותפסו את הקפה','כוס חדשה. קלה כמעט כמו קודם','משהו מושך אתכם למטה','הרימו גבוה יותר','היא לא נשארה "שם"','עוד קצת. למעלה','אתם מחזיקים את כולן'][level()]);
}
function begin(){
  Object.assign(G,{cup:0,old:[],rain:[],splash:[],time:0,thrown:0,fly:null,aim:view.F.slice(),vel:[0,0,0]});
  ['pTime','pYears'].forEach(i=>$(i).style.display='block');$('bottom').style.display='flex';
  $('intro').style.display=$('end').style.display=$('big').style.display='none';
  $('tint').style.opacity=0;$('cam').style.filter='';$('vYears').textContent=0;startCup();
}
function caught(){
  G.got++;dots();buzz(18+G.cup*8);tone(720-G.cup*80,260-G.cup*25,.22);
  const p=mul(G.aim,3.1);for(let i=0;i<9;i++)G.splash.push({p:p.slice(),v:[rnd(-.8,.8),rnd(.4,1.6),rnd(-.8,.8)],life:1});
  G.drops=[];
  if(G.cup===TUNE.dropsPerCup.length-1&&G.got>=TUNE.collapseAfter)return collapse();
  if(G.got>=need()){G.state='drink';say(view.gyro?'מלאה! הטו את הטלפון הצידה ושתו':'מלאה! לחצו והחזיקו כדי לשתות')}
  else setTimeout(()=>{if(G.state==='catch'&&!G.drops.length)spawn()},350);
}
function toss(dx,dy){
  if(G.state!=='toss')return;
  const yaw=view.yaw+clamp(dx/innerWidth,-1,1)*1.2+rnd(-.15,.15),pitch=rnd(-24,6)*D;
  G.fly={from:mul(G.aim,3),to:mul(dirOf(yaw,pitch),rnd(2.8,3.4)),k:0};
  G.state='flying';say('זהו. נזרקה.');tone(240,700,.35,'triangle',.15);
}
function landed(){
  const c={pos:G.fly.to,up:norm([rnd(-.7,.7),rnd(.25,1),rnd(-.7,.7)]),phase:rnd(0,6),k:G.cup%3,face:dirOf(rnd(-3.1,3.1),0)};
  G.old.push(c);G.ghosts.push({pos:mul(c.pos,1.5),up:c.up,k:c.k});G.ghosts=G.ghosts.slice(-60);
  try{localStorage.setItem('away-cups',JSON.stringify(G.ghosts))}catch(e){}
  G.fly=null;G.cup++;G.thrown++;$('vYears').textContent=G.thrown*TUNE.yearsPerCup;
  tone(130,40,.5,'sine',.5);buzz([60,40,90]);say('היא עדיין כאן.');G.state='landed';G.vel=[0,-.5,0];
  setTimeout(()=>{if(G.state==='landed')startCup()},1700);
}
function collapse(){
  G.state='collapse';G.drops=[];G.ct=0;say('כבדה מדי');$('dots').innerHTML='';
  G.thrown++;$('vYears').textContent=G.thrown*TUNE.yearsPerCup;tone(180,30,1.6,'sawtooth',.2);buzz([200,80,300]);
}
function finish(){
  G.state='end';$('big').style.display='none';
  const m=Math.floor(G.time/60),s=Math.floor(G.time%60);
  $('summary').innerHTML=`השתמשתם ב-<b>${G.thrown}</b> כוסות במשך <b>${m}:${String(s).padStart(2,'0')}</b> דקות.<br>הן ישאירו אחריהן עד <b>${G.thrown*TUNE.yearsPerCup}</b> שנות כוס.<br>תסתובבו. הן שם.`;
  setTimeout(()=>{$('end').style.display='flex'},3500);
}

function update(dt){
  G.t+=dt;const s=G.state,L=level();
  if(['catch','drink','toss','flying','landed'].includes(s)){G.time+=dt;$('vTime').textContent=`${Math.floor(G.time/60)}:${String(Math.floor(G.time%60)).padStart(2,'0')}`}
  // cup follows the hand: a heavy damped spring that also hangs
  let target=dirOf(view.yaw,clamp(view.pitch-sagOf(L)*D,-1.5,1.5)),w=stiffOf(L),z=TUNE.damping[L];
  if(s==='collapse'||s==='years'||s==='end'){target=dirOf(yawOf(G.aim),-72*D);w=3;z=.5}
  const acc=sub(mul(sub(target,G.aim),w*w),mul(G.vel,2*z*w));
  G.vel=add(G.vel,mul(acc,dt));G.aim=norm(add(G.aim,mul(G.vel,dt)));
  if(s==='catch')for(const d of G.drops)if(G.t-d.born>.35&&angle(G.aim,dropDir(d))<TUNE.catchAngle*D){caught();break}
  if(s==='drink'){if(G.hold||Math.abs(view.roll)>TUNE.tiltToDrink*D)G.pouring=true;const pouring=G.pouring||G.hold;
    if(pouring){const before=G.fill;G.fill=Math.max(0,G.fill-dt*.8);if(Math.floor(before*6)!==Math.floor(G.fill*6))tone(300,180,.12,'sine',.18);
      if(G.fill<=0){G.state='toss';say('ריקה. החליקו על המסך וזרקו אותה');dots()}}}
  else if(s==='catch'||s==='collapse')G.fill=lerp(G.fill,G.got/need(),Math.min(1,dt*8));
  if(s==='flying'){G.fly.k+=dt*1.15;if(G.fly.k>=1)landed()}
  if(s==='collapse'){G.ct+=dt;if(G.ct>3.2){G.state='years';G.ct=0;$('big').style.display='block';$('bottom').style.display='none';$('pTime').style.display=$('pYears').style.display='none';$('tint').style.opacity=1}}
  if(s==='years'){G.ct+=dt;const k=Math.min(1,G.ct/13);
    $('cam').style.filter=`grayscale(${k}) brightness(${1-k*.45}) sepia(${k*.5})`;
    const year=Math.round(YEAR0+TUNE.yearsPerCup*Math.pow(k,1.3));
    $('big').textContent=G.ct<14?year:'????';
    if(G.rain.length<Math.min(170,G.ct*13)){const yaw=rnd(-Math.PI,Math.PI),rad=rnd(2.6,7),floor=rnd(-3.2,-1.1)+Math.max(0,G.ct-5)*.07;
      G.rain.push({pos:[Math.sin(yaw)*rad,rnd(3,6),-Math.cos(yaw)*rad],floor,vy:0,up:norm([rnd(-1,1),rnd(-.4,1),rnd(-1,1)])})}
    if(G.ct>17)finish();
  }
  for(const r of G.rain)if(r.pos[1]>r.floor){r.vy-=5*dt;r.pos[1]=Math.max(r.floor,r.pos[1]+r.vy*dt);if(r.pos[1]===r.floor&&Math.random()<.3)tone(rnd(90,160),40,.15,'sine',.12)}
  for(const p of G.splash){p.v[1]-=4*dt;p.p=add(p.p,mul(p.v,dt));p.life-=dt*1.8}
  G.splash=G.splash.filter(p=>p.life>0);
  if(drone&&ac){const on=s!=='intro';drone.g.gain.setTargetAtTime(on?Math.min(.16,G.thrown*.022):0,ac.currentTime,.4);drone.o.frequency.setTargetAtTime(70-G.thrown*5,ac.currentTime,.5)}
}

function render(){
  $('room').style.transform=`translateY(${clamp(Math.tan(clamp(view.pitch,-1.2,1.2))/Math.tan(37*D)*innerHeight/2,-innerHeight*1.4,innerHeight*1.4)}px)`;
  const dpr=Math.min(devicePixelRatio||1,2),W=Math.round(cv.clientWidth*dpr),H=Math.round(cv.clientHeight*dpr);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  gl.viewport(0,0,W,H);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);
  const asp=W/H,fov=(asp<1?74:60)*D,f=1/Math.tan(fov/2),n=.1,fa=60;
  gl.uniformMatrix4fv(loc.P,false,[f/asp,0,0,0,0,f,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0]);
  const{R,U,F}=view;
  gl.uniform3fv(loc.L,norm(add(add(mul(F,-.75),mul(U,.65)),mul(R,-.5))));
  gl.uniformMatrix4fv(loc.V,false,[R[0],U[0],-F[0],0,R[1],U[1],-F[1],0,R[2],U[2],-F[2],0,0,0,0,1]);
  gl.disable(gl.BLEND);
  const s=G.state;
  for(const c of G.ghosts.slice(0,G.ghosts.length-G.old.length))drawCup(c.pos,c.up,0,{mesh:USED[c.k||0],s:.7,dirt:.8});
  G.old.forEach((c,i)=>drawCup(add(c.pos,[0,Math.sin(G.t*.8+c.phase)*.04,0]),c.up,0,{mesh:USED[c.k],face:c.face,dirt:s==='years'||s==='end'?.8:Math.min(.6,(G.old.length-i-1)*.13)}));
  G.rain.forEach((r,i)=>drawCup(r.pos,r.up,0,{mesh:USED[i%3],dirt:.55,s:.9}));
  let cupPos=null;
  if(['catch','drink','toss','landed','collapse','years','end'].includes(s)){
    const a=G.aim,[r,u]=frame(a),tip=s==='drink'&&(G.pouring||G.hold)?.55:0;
    let up=norm(add(mul(u,Math.cos(.5+tip)),mul(a,-Math.sin(.5+tip))));
    up=norm(add(up,mul(r,clamp(-dot(G.vel,r)*.35,-.5,.5))));          // sway against motion
    cupPos=sub(mul(a,3),mul(up,.38));
    drawCup(cupPos,up,G.fill,{face:mul(a,-1)});
  }
  if(s==='flying'){const k=G.fly.k,p=add(add(mul(G.fly.from,1-k),mul(G.fly.to,k)),[0,Math.sin(k*Math.PI)*1.1,0]);cupPos=p;drawCup(p,[Math.sin(k*9),Math.cos(k*9),.3],0,{face:mul(view.F,-1)})}
  // tethers: every old cup stays tied to the one in your hand
  if(cupPos)for(const c of G.old){const A=c.pos,B=add(cupPos,[0,-.3,0]),mid=add(mul(add(A,B),.5),[0,-.55,0]);let prev=A;
    for(let i=1;i<=14;i++){const k=i/14,p=add(add(mul(A,(1-k)*(1-k)),mul(mid,2*k*(1-k))),mul(B,k*k)),d=sub(p,prev),[rr,uu]=frame(norm(d));draw(MESH.rope,prev,rr,d,uu,.012,1,.012,DARK,{gloss:.2});prev=p}}
  for(const p of G.splash)draw(MESH.ball,p.p,[1,0,0],[0,1,0],[0,0,1],.035*p.life,.035*p.life,.035*p.life,DROP,{gloss:1});
  for(const d of G.drops){const p=mul(dropDir(d),3.7),k=Math.min(1,(G.t-d.born)*3),w=1+Math.sin(G.t*6+d.phase)*.06;
    draw(MESH.drop,p,[1,0,0],[0,1,0],[0,0,1],k*w*1.15,k*(2-w)*1.15,k*w*1.15,DROP,{gloss:1});
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
    const g=.34+Math.sin(G.t*4)*.04;draw(MESH.ball,p,[1,0,0],[0,1,0],[0,0,1],g,g,g,GLOW,{glow:true,alpha:.55});gl.depthMask(true);gl.disable(gl.BLEND)}
  // arrow to the drop when it is off screen
  const ar=$('arrow');let show=false;
  if(s==='catch'&&G.drops[0]){const d=dropDir(G.drops[0]),x=dot(d,R),y=dot(d,U),zz=dot(d,F),sx=x/(zz||1e-3)*f/asp,sy=y/(zz||1e-3)*f;
    if(zz<0||Math.abs(sx)>.95||Math.abs(sy)>.9){show=true;const a=Math.atan2(y,x),cw=innerWidth/2,ch=innerHeight/2,t=Math.min((cw-34)/Math.abs(Math.cos(a)||1e-3),(ch-175)/Math.abs(Math.sin(a)||1e-3));
      ar.style.left=cw+Math.cos(a)*t+'px';ar.style.top=ch-Math.sin(a)*t+'px';ar.style.transform=`rotate(${-a}rad)`}}
  ar.style.display=show?'block':'none';
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;updateView();
  if(G.state!=='intro')for(let i=0;i<2;i++)update(dt/2);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- input ---------- */
let down=null;
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY};G.hold=true;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!down)return;if(!view.gyro&&G.state!=='toss'&&G.state!=='drink'){view.yaw-=(e.clientX-down.lx)*.005;view.pitch=clamp(view.pitch+(e.clientY-down.ly)*.005,-1.45,1.45)}down.lx=e.clientX;down.ly=e.clientY});
function up(e){if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>50)toss(dx,dy)}down=null;G.hold=false}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',()=>{down=null;G.hold=false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

$('go').onclick=async()=>{
  $('go').disabled=true;audioInit();
  // motion permission must be the first await after the tap (iOS)
  try{const D_=window.DeviceOrientationEvent;
    if(D_&&D_.requestPermission){if(await D_.requestPermission()!=='granted')$('err').textContent='בלי גישה לתנועה: אפשר לגרור את המסך'}
    addEventListener('deviceorientation',onOrient)}catch(e){}
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const v=$('cam');v.srcObject=st;v.style.display='block';await v.play()}catch(e){}
  await keepAwake();
  setTimeout(()=>{updateView();begin();$('go').disabled=false},350);
};
async function keepAwake(){try{await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&G.state!=='intro')keepAwake()});
$('again').onclick=()=>{audioInit();begin()};
// long press on the end title clears the cups left from earlier games (for the facilitator)
let lp;const h=$('end').querySelector('h1');
h.addEventListener('pointerdown',()=>lp=setTimeout(()=>{G.ghosts=[];G.old=[];G.rain=[];try{localStorage.removeItem('away-cups')}catch(e){}h.style.opacity=.4},2500));
['pointerup','pointerleave','pointercancel'].forEach(ev=>h.addEventListener(ev,()=>clearTimeout(lp)));
/* ---------- ?debug: live numbers, +/- per knob (updates the address so the link can be copied), copy log ---------- */
if(URLP.has('debug')){
  const KN={heavy:[.1,0,3],slow:[.1,.3,3],catchAngle:[.5,3,20],tiltToDrink:[2,10,60],yearsPerCup:[5,5,500]};
  const box=document.createElement('div');
  box.style.cssText='position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:9;background:rgba(0,0,0,.72);color:#fff;font:12px/1.35 ui-monospace,monospace;padding:8px;border-radius:10px;direction:ltr;text-align:left;max-width:calc(100% - 16px)';
  const live=document.createElement('div');box.appendChild(live);
  const btn=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:700 13px system-ui;padding:4px 10px;margin:2px;border-radius:8px;box-shadow:none;background:#c4702c';b.onclick=e=>{e.stopPropagation();f()};return b};
  const rows={};
  for(const k in KN){const r=document.createElement('div'),[st,lo,hi]=KN[k];
    const set=v=>{TUNE[k]=Math.round(clamp(v,lo,hi)*100)/100;URLP.set(k,TUNE[k]);history.replaceState(null,'','?'+URLP.toString().replace('debug=','debug'));show()};
    const lab=document.createElement('span');const show=()=>lab.textContent=` ${k} ${TUNE[k]} `;rows[k]=show;
    r.append(btn('−',()=>set(TUNE[k]-st)),lab,btn('+',()=>set(TUNE[k]+st)));show();box.appendChild(r)}
  const LOG=[];let lt=0,fps=0,fc=0,ft=performance.now();
  box.appendChild(btn('Copy log',()=>{const t=JSON.stringify({tune:TUNE,ua:navigator.userAgent,samples:LOG});
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('copied '+LOG.length+' samples'),()=>prompt('copy:',t))}));
  document.body.appendChild(box);
  (function tick(now){fc++;if(now-ft>1000){fps=fc;fc=0;ft=now}
    const L=level(),d=G.drops[0],off=d?angle(G.aim,dropDir(d))/D:null,r=x=>Math.round(x*10)/10;
    const row={t:r(G.time),state:G.state,cup:G.cup,got:G.got,pitch:r(view.pitch/D),roll:r(view.roll/D),cupPitch:r(pitchOf(G.aim)/D),sag:r(sagOf(L)),stiff:r(stiffOf(L)),toDrop:off==null?null:r(off),gyro:view.gyro};
    live.textContent=`fps ${fps}  gyro ${view.gyro}\n${row.state} cup ${row.cup+1} drops ${row.got}/${need()}\nphone pitch ${row.pitch}°  roll ${row.roll}°\ncup pitch ${row.cupPitch}°  sag ${row.sag}°  stiff ${row.stiff}\nto drop ${row.toDrop}° (catch < ${TUNE.catchAngle})`;
    live.style.whiteSpace='pre';
    if(G.state!=='intro'&&now-lt>250){lt=now;LOG.push(row);if(LOG.length>2400)LOG.shift()}
    requestAnimationFrame(tick)})(performance.now());
}
window.__g={G,view,TUNE,toss};
</script>
